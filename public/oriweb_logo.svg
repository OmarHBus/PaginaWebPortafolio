<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#75E6F7"/>
      <stop offset="100%" stop-color="#11B8E7"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173F6E"/>
      <stop offset="100%" stop-color="#0A2342"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#08213f" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Transparent background -->
  <g filter="url(#softShadow)" transform="translate(70,48)">
    <!-- Browser window outline -->
    <rect x="98" y="30" width="290" height="210" rx="28" stroke="url(#navyGrad)" stroke-width="16"/>
    <line x1="98" y1="94" x2="388" y2="94" stroke="url(#navyGrad)" stroke-width="12"/>
    <circle cx="136" cy="62" r="11" fill="url(#cyanGrad)"/>
    <circle cx="178" cy="62" r="11" fill="url(#cyanGrad)"/>
    <circle cx="220" cy="62" r="11" fill="url(#cyanGrad)"/>

    <!-- Cyan ring -->
    <circle cx="176" cy="202" r="105" stroke="url(#cyanGrad)" stroke-width="42" stroke-linecap="round" stroke-dasharray="595 70" transform="rotate(24 176 202)"/>

    <!-- Cursor -->
    <path d="M194 176L246 292L273 255L311 298L338 278L300 236L341 219L194 176Z" fill="url(#navyGrad)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(505,92)">
    <text x="0" y="178"
          font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
          font-size="166"
          font-weight="500"
          letter-spacing="-5"
          fill="url(#navyGrad)">Ori</text>
    <text x="305" y="178"
          font-family="Inter, Poppins, Montserrat, Arial, sans-serif"
          font-size="166"
          font-weight="500"
          letter-spacing="-5"
          fill="url(#cyanGrad)">Web</text>
  </g>
</svg>
