<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EEAF7"/>
      <stop offset="100%" stop-color="#19B4F2"/>
    </linearGradient>
    <linearGradient id="cyanText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25C2FF"/>
      <stop offset="100%" stop-color="#1FA8F5"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3A7A"/>
      <stop offset="100%" stop-color="#082C66"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(70,80)">
    <rect x="40" y="40" width="380" height="320" rx="34" stroke="url(#navyGrad)" stroke-width="18"/>
    <line x1="40" y1="128" x2="420" y2="128" stroke="url(#navyGrad)" stroke-width="16"/>
    <circle cx="82" cy="84" r="14" fill="url(#navyGrad)"/>
    <circle cx="136" cy="84" r="14" fill="url(#navyGrad)"/>
    <circle cx="190" cy="84" r="14" fill="url(#navyGrad)"/>

    <!-- Circular ring -->
    <circle cx="208" cy="245" r="100" stroke="url(#cyanGrad)" stroke-width="34" stroke-linecap="round" stroke-dasharray="520 120" transform="rotate(20 208 245)"/>

    <!-- Cursor -->
    <path d="M228 235L278 383L308 345L362 398L391 372L337 319L393 298L228 235Z" fill="url(#navyGrad)"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(540,102)">
